name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install librime (headers for bindgen, dylib for the daemon)
        run: brew install librime
      - name: Build
        run: cargo build --workspace
      - name: Clippy
        run: cargo clippy --workspace
      - name: Test
        run: cargo test --workspace
